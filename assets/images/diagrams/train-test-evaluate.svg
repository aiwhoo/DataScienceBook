<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="600" fill="#2a2a2a">Train, Predict, Evaluate</text>
  <text x="320" y="46" text-anchor="middle" font-size="12" fill="#6a6a6a">never let the model peek at the test set</text>

  <rect x="220" y="60" width="200" height="50" rx="6" fill="#eef0f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="320" y="90" text-anchor="middle" font-size="13" fill="#2a2a2a">Full Dataset (216 rows)</text>

  <g stroke="#a8a8a8" stroke-width="1.5" fill="none">
    <path d="M 280 110 L 130 150"/>
    <path d="M 360 110 L 510 150"/>
  </g>

  <rect x="30" y="150" width="200" height="60" rx="6" fill="#eef0f4" stroke="#10a37f" stroke-width="1.5"/>
  <text x="130" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#10a37f">Training Set (80%)</text>
  <text x="130" y="196" text-anchor="middle" font-size="10" fill="#6a6a6a">~173 rows</text>

  <rect x="410" y="150" width="200" height="60" rx="6" fill="#f4eef2" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="510" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#6f42c1">Test Set (20%)</text>
  <text x="510" y="196" text-anchor="middle" font-size="10" fill="#6a6a6a">~43 rows — locked away</text>

  <g stroke="#10a37f" stroke-width="2" fill="none"><path d="M 130 210 L 130 248"/></g>
  <polygon points="130,248 125,239 135,239" fill="#10a37f"/>
  <text x="185" y="232" text-anchor="middle" font-size="10" fill="#10a37f">model.fit()</text>

  <rect x="30" y="250" width="200" height="60" rx="6" fill="#eef0f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="130" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#2a2a2a">Trained Model</text>
  <text x="130" y="296" text-anchor="middle" font-size="10" fill="#6a6a6a">learned the pattern</text>

  <g stroke="#a8a8a8" stroke-width="1.5" fill="none">
    <path d="M 200 310 L 300 348"/>
    <path d="M 480 210 L 380 348"/>
  </g>
  <text x="290" y="330" text-anchor="middle" font-size="10" fill="#6a6a6a">model.predict()</text>
  <text x="470" y="230" text-anchor="middle" font-size="10" fill="#6a6a6a">hidden rows,</text>
  <text x="470" y="242" text-anchor="middle" font-size="10" fill="#6a6a6a">shown once</text>

  <rect x="170" y="350" width="300" height="70" rx="6" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="320" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#2a2a2a">Predictions vs. Actual</text>
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#6a6a6a">→ graded with MSE and R²</text>

  <text x="320" y="440" text-anchor="middle" font-size="10" fill="#9a9a9a">Sample diagram — hand-built vector, not AI-generated</text>
</svg>
