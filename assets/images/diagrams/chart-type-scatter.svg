<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="260" height="240" fill="#fafafa"/>
  <text x="130" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2a2a">Scatter Plot</text>
  <text x="130" y="42" text-anchor="middle" font-size="10" fill="#6a6a6a">reveals a relationship between two numbers</text>

  <line x1="35" y1="185" x2="235" y2="185" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="35" y1="60" x2="35" y2="185" stroke="#8a8a8a" stroke-width="1.5"/>

  <g fill="#6f42c1" fill-opacity="0.8">
    <circle cx="55" cy="168" r="5"/>
    <circle cx="70" cy="150" r="5"/>
    <circle cx="90" cy="158" r="5"/>
    <circle cx="105" cy="130" r="5"/>
    <circle cx="120" cy="140" r="5"/>
    <circle cx="140" cy="112" r="5"/>
    <circle cx="155" cy="120" r="5"/>
    <circle cx="170" cy="95" r="5"/>
    <circle cx="190" cy="100" r="5"/>
    <circle cx="205" cy="78" r="5"/>
    <circle cx="220" cy="85" r="5"/>
  </g>
  <line x1="48" y1="175" x2="228" y2="72" stroke="#a8a8a8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="130" y="198" text-anchor="middle" font-size="9" fill="#8a8a8a">height →</text>
  <text x="130" y="214" text-anchor="middle" font-size="10" fill="#6a6a6a">one dot per case —</text>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#6a6a6a">dots drifting up together = related</text>
</svg>
