<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#2a2a2a">ETL Turns Messy Rows Into Model-Ready Rows</text>
  <text x="350" y="50" text-anchor="middle" font-size="12" fill="#6a6a6a">Extract → Transform → Load, one row at a time</text>

  <!-- Extract: raw messy table -->
  <g>
    <rect x="20" y="80" width="190" height="30" fill="#6f42c1"/>
    <text x="115" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">EXTRACT</text>
    <rect x="20" y="110" width="190" height="140" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
    <text x="30" y="128" font-size="10" fill="#8a8a8a">Name</text>
    <text x="95" y="128" font-size="10" fill="#8a8a8a">Time</text>
    <text x="160" y="128" font-size="10" fill="#8a8a8a">Steps</text>
    <line x1="20" y1="135" x2="210" y2="135" stroke="#d5d5d5"/>
    <text x="30" y="155" font-size="11" fill="#c0392b">alice</text>
    <text x="95" y="155" font-size="11" fill="#c0392b">8:00a</text>
    <text x="160" y="155" font-size="11" fill="#c0392b">—</text>
    <line x1="20" y1="165" x2="210" y2="165" stroke="#d5d5d5"/>
    <text x="30" y="185" font-size="11" fill="#c0392b">Alice</text>
    <text x="95" y="185" font-size="11" fill="#c0392b">8:15 AM</text>
    <text x="160" y="185" font-size="11" fill="#2a2a2a">512</text>
    <line x1="20" y1="195" x2="210" y2="195" stroke="#d5d5d5"/>
    <text x="30" y="215" font-size="11" fill="#2a2a2a">Charlie</text>
    <text x="95" y="215" font-size="11" fill="#c0392b">—</text>
    <text x="160" y="215" font-size="11" fill="#2a2a2a">0</text>
    <text x="115" y="238" text-anchor="middle" font-size="10" fill="#c0392b">inconsistent · missing values</text>
  </g>

  <g stroke="#a8a8a8" stroke-width="2" fill="none"><path d="M 210 160 L 245 160"/></g>
  <polygon points="245,160 236,155 236,165" fill="#a8a8a8"/>

  <!-- Transform: operations -->
  <g>
    <rect x="255" y="80" width="190" height="30" fill="#10a37f"/>
    <text x="350" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">TRANSFORM</text>
    <rect x="255" y="110" width="190" height="140" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="350" cy="145" r="18" fill="none" stroke="#10a37f" stroke-width="2.5"/>
    <circle cx="350" cy="145" r="6" fill="#10a37f"/>
    <text x="270" y="185" font-size="11" fill="#2a2a2a">• Fill missing values</text>
    <text x="270" y="205" font-size="11" fill="#2a2a2a">• Standardize time format</text>
    <text x="270" y="225" font-size="11" fill="#2a2a2a">• Encode names → numbers</text>
  </g>

  <g stroke="#a8a8a8" stroke-width="2" fill="none"><path d="M 445 160 L 480 160"/></g>
  <polygon points="480,160 471,155 471,165" fill="#a8a8a8"/>

  <!-- Load: clean table -->
  <g>
    <rect x="490" y="80" width="190" height="30" fill="#6f42c1"/>
    <text x="585" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">LOAD</text>
    <rect x="490" y="110" width="190" height="140" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
    <text x="500" y="128" font-size="10" fill="#8a8a8a">Name_id</text>
    <text x="570" y="128" font-size="10" fill="#8a8a8a">Hour</text>
    <text x="630" y="128" font-size="10" fill="#8a8a8a">Steps</text>
    <line x1="490" y1="135" x2="680" y2="135" stroke="#d5d5d5"/>
    <text x="500" y="155" font-size="11" fill="#2a2a2a">0</text>
    <text x="570" y="155" font-size="11" fill="#2a2a2a">8</text>
    <text x="630" y="155" font-size="11" fill="#2a2a2a">0</text>
    <line x1="490" y1="165" x2="680" y2="165" stroke="#d5d5d5"/>
    <text x="500" y="185" font-size="11" fill="#2a2a2a">0</text>
    <text x="570" y="185" font-size="11" fill="#2a2a2a">8</text>
    <text x="630" y="185" font-size="11" fill="#2a2a2a">512</text>
    <line x1="490" y1="195" x2="680" y2="195" stroke="#d5d5d5"/>
    <text x="500" y="215" font-size="11" fill="#2a2a2a">1</text>
    <text x="570" y="215" font-size="11" fill="#2a2a2a">9</text>
    <text x="630" y="215" font-size="11" fill="#2a2a2a">0</text>
    <text x="585" y="238" text-anchor="middle" font-size="10" fill="#10a37f">consistent · numeric · complete</text>
  </g>

  <text x="350" y="290" text-anchor="middle" font-size="12" fill="#6a6a6a">Same three rows, before and after — cleaned, standardized, and translated into numbers a model can use.</text>
  <text x="350" y="345" text-anchor="middle" font-size="10" fill="#9a9a9a">Sample diagram — hand-built vector, not AI-generated</text>
</svg>
