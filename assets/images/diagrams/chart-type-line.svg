<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="260" height="240" fill="#fafafa"/>
  <text x="130" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#2a2a2a">Line Chart</text>
  <text x="130" y="42" text-anchor="middle" font-size="10" fill="#6a6a6a">shows a trend over time</text>

  <line x1="35" y1="185" x2="235" y2="185" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="35" y1="60" x2="35" y2="185" stroke="#8a8a8a" stroke-width="1.5"/>

  <polyline points="45,170 80,140 115,90 150,70 185,105 220,160" fill="none" stroke="#10a37f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="45" cy="170" r="4" fill="#10a37f"/>
  <circle cx="80" cy="140" r="4" fill="#10a37f"/>
  <circle cx="115" cy="90" r="4" fill="#10a37f"/>
  <circle cx="150" cy="70" r="4" fill="#10a37f"/>
  <circle cx="185" cy="105" r="4" fill="#10a37f"/>
  <circle cx="220" cy="160" r="4" fill="#10a37f"/>

  <text x="45" y="198" text-anchor="middle" font-size="8" fill="#8a8a8a">6am</text>
  <text x="115" y="198" text-anchor="middle" font-size="8" fill="#8a8a8a">Noon</text>
  <text x="220" y="198" text-anchor="middle" font-size="8" fill="#8a8a8a">6pm</text>

  <text x="130" y="222" text-anchor="middle" font-size="10" fill="#6a6a6a">temperature by hour — the rise and fall is the story</text>
</svg>
