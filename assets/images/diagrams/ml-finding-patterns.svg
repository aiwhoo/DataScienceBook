<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="640" height="340" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#2a2a2a">Machine Learning Finds the Pattern in the Noise</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#6a6a6a">no one writes the rule — the model finds it from examples</text>

  <!-- Left panel: scattered, unlabeled points -->
  <g>
    <rect x="30" y="75" width="250" height="200" rx="6" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="155" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#6a6a6a">Examples, no rule given</text>
    <line x1="55" y1="245" x2="280" y2="245" stroke="#d5d5d5" stroke-width="1"/>
    <line x1="55" y1="110" x2="55" y2="245" stroke="#d5d5d5" stroke-width="1"/>
    <g fill="#a8a8a8">
      <circle cx="80" cy="220" r="6"/>
      <circle cx="105" cy="175" r="6"/>
      <circle cx="130" cy="230" r="6"/>
      <circle cx="150" cy="150" r="6"/>
      <circle cx="175" cy="205" r="6"/>
      <circle cx="200" cy="170" r="6"/>
      <circle cx="220" cy="235" r="6"/>
      <circle cx="240" cy="130" r="6"/>
      <circle cx="95" cy="120" r="6"/>
      <circle cx="255" cy="190" r="6"/>
    </g>
    <text x="155" y="262" text-anchor="middle" font-size="10" fill="#8a8a8a">just points — no visible order</text>
  </g>

  <!-- Middle: arrow + label -->
  <g stroke="#6f42c1" stroke-width="2.5" fill="none">
    <path d="M 288 175 L 348 175"/>
  </g>
  <polygon points="348,175 337,168 337,182" fill="#6f42c1"/>
  <circle cx="318" cy="130" r="16" fill="none" stroke="#6f42c1" stroke-width="3"/>
  <line x1="329" y1="141" x2="340" y2="152" stroke="#6f42c1" stroke-width="3" stroke-linecap="round"/>
  <text x="318" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#6f42c1">learns from</text>
  <text x="318" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#6f42c1">the examples</text>

  <!-- Right panel: same points, pattern revealed -->
  <g>
    <rect x="360" y="75" width="250" height="200" rx="6" fill="#f4eef2" stroke="#6f42c1" stroke-width="1.5"/>
    <text x="485" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#6f42c1">Pattern the model found</text>
    <line x1="385" y1="245" x2="610" y2="245" stroke="#d5d5d5" stroke-width="1"/>
    <line x1="385" y1="110" x2="385" y2="245" stroke="#d5d5d5" stroke-width="1"/>
    <path d="M 400 235 Q 495 235 540 125" fill="none" stroke="#6f42c1" stroke-width="3"/>
    <g fill="#6f42c1">
      <circle cx="410" cy="220" r="6"/>
      <circle cx="435" cy="175" r="6"/>
      <circle cx="460" cy="230" r="6"/>
      <circle cx="480" cy="150" r="6"/>
      <circle cx="505" cy="205" r="6"/>
      <circle cx="530" cy="170" r="6"/>
      <circle cx="550" cy="235" r="6"/>
      <circle cx="570" cy="130" r="6"/>
      <circle cx="425" cy="120" r="6"/>
      <circle cx="585" cy="190" r="6"/>
    </g>
    <text x="485" y="262" text-anchor="middle" font-size="10" fill="#6f42c1">same points — now with a rule that predicts new ones</text>
  </g>
</svg>
