<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="780" height="260" fill="#fafafa"/>

  <!-- Extraction -->
  <rect x="10" y="10" width="210" height="240" rx="6" fill="#fff5f0" stroke="#ff6600" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="115" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#ff6600">EXTRACTION</text>
  <rect x="25" y="45" width="80" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="65" y="66" text-anchor="middle" font-size="9" fill="#2a2a2a">Sheet 1</text>
  <rect x="25" y="90" width="80" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="65" y="111" text-anchor="middle" font-size="9" fill="#2a2a2a">Sheet 2</text>
  <rect x="25" y="135" width="80" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="65" y="156" text-anchor="middle" font-size="9" fill="#2a2a2a">Sheet 3</text>
  <rect x="130" y="90" width="80" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.25"/>
  <text x="170" y="111" text-anchor="middle" font-size="9" fill="#2a2a2a">pd.concat</text>
  <g stroke="#a8a8a8" stroke-width="1.25" fill="none">
    <path d="M 105 62 L 128 100"/>
    <path d="M 105 107 L 128 107"/>
    <path d="M 105 152 L 128 114"/>
  </g>

  <!-- Transformation -->
  <rect x="240" y="10" width="300" height="240" rx="6" fill="#fff5f0" stroke="#ff6600" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="390" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#ff6600">TRANSFORMATION</text>
  <rect x="255" y="55" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="315" y="76" text-anchor="middle" font-size="9" fill="#2a2a2a">Normalize</text>
  <rect x="255" y="100" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="315" y="121" text-anchor="middle" font-size="9" fill="#2a2a2a">Sort / Spatial</text>
  <rect x="255" y="145" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="315" y="166" text-anchor="middle" font-size="9" fill="#2a2a2a">Encode</text>
  <rect x="255" y="190" width="120" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="315" y="211" text-anchor="middle" font-size="9" fill="#2a2a2a">Aggregate</text>
  <g stroke="#a8a8a8" stroke-width="1.25" fill="none">
    <path d="M 315 89 L 315 98"/>
    <path d="M 315 134 L 315 143"/>
    <path d="M 315 179 L 315 188"/>
  </g>

  <!-- Loading -->
  <rect x="560" y="10" width="210" height="240" rx="6" fill="#fff5f0" stroke="#ff6600" stroke-width="1.25" stroke-dasharray="4,3"/>
  <text x="665" y="30" text-anchor="middle" font-size="11" font-weight="600" fill="#ff6600">LOADING</text>
  <rect x="580" y="90" width="80" height="34" rx="4" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="620" y="111" text-anchor="middle" font-size="9" fill="#2a2a2a">.to_csv</text>
  <path d="M 685 88 h60 a10,6 0 0 1 10,6 v40 a10,6 0 0 1 -10,6 h-60 a10,6 0 0 1 -10,-6 v-40 a10,6 0 0 1 10,-6 z" fill="#f4eef2" stroke="#6f42c1" stroke-width="1.25"/>
  <text x="720" y="112" text-anchor="middle" font-size="8" fill="#6f42c1">Final CSV</text>
  <g stroke="#a8a8a8" stroke-width="1.25" fill="none"><path d="M 660 107 L 683 107"/></g>

  <!-- Cross-stage arrows -->
  <g stroke="#a8a8a8" stroke-width="1.5" fill="none">
    <path d="M 221 107 L 253 72"/>
    <path d="M 540 207 L 578 107"/>
  </g>
  <g fill="#a8a8a8">
    <polygon points="253,72 244,73 249,82"/>
    <polygon points="578,107 570,102 566,111"/>
  </g>
</svg>
