<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="620" height="200" fill="#fafafa"/>
  <rect x="10" y="75" width="150" height="50" rx="5" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.25"/>
  <text x="85" y="97" text-anchor="middle" font-size="10" fill="#2a2a2a">Is there a</text>
  <text x="85" y="111" text-anchor="middle" font-size="10" fill="#2a2a2a">natural order?</text>

  <rect x="220" y="10" width="150" height="42" rx="5" fill="#f4eef2" stroke="#10a37f" stroke-width="1.5"/>
  <text x="295" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#10a37f">Label Encoding</text>
  <text x="185" y="45" text-anchor="middle" font-size="9" fill="#10a37f">Yes: Ordinal</text>

  <rect x="220" y="148" width="150" height="42" rx="5" fill="#fdf6e3" stroke="#856404" stroke-width="1.5"/>
  <text x="295" y="174" text-anchor="middle" font-size="10" font-weight="600" fill="#856404">One-Hot Encoding</text>
  <text x="185" y="163" text-anchor="middle" font-size="9" fill="#856404">No: Nominal</text>

  <rect x="420" y="10" width="190" height="42" rx="5" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="515" y="36" text-anchor="middle" font-size="10" fill="#2a2a2a">Assigns 0, 1, 2…</text>

  <rect x="420" y="148" width="190" height="42" rx="5" fill="#ffffff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="515" y="167" text-anchor="middle" font-size="9" fill="#2a2a2a">Creates binary</text>
  <text x="515" y="180" text-anchor="middle" font-size="9" fill="#2a2a2a">columns 0 or 1</text>

  <g stroke="#a8a8a8" stroke-width="1.5" fill="none">
    <path d="M 160 90 L 218 31"/>
    <path d="M 160 110 L 218 169"/>
    <path d="M 370 31 L 418 31"/>
    <path d="M 370 169 L 418 169"/>
  </g>
  <g fill="#a8a8a8">
    <polygon points="218,31 207,29 211,39"/>
    <polygon points="218,169 211,161 207,171"/>
    <polygon points="418,31 410,26 410,36"/>
    <polygon points="418,169 410,164 410,174"/>
  </g>
</svg>
