<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="260" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="20" font-weight="600" fill="#2a2a2a">Your Capstone, Step by Step</text>
  <text x="350" y="46" text-anchor="middle" font-size="12" fill="#6a6a6a">five steps, built from skills you already have</text>

  <!-- Step 1 -->
  <rect x="15" y="80" width="122" height="110" rx="6" fill="#f4eef2" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="76" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#6f42c1">1</text>
  <text x="76" y="130" text-anchor="middle" font-size="11" fill="#2a2a2a">Choose a</text>
  <text x="76" y="145" text-anchor="middle" font-size="11" fill="#2a2a2a">Dataset</text>
  <text x="76" y="170" text-anchor="middle" font-size="10" fill="#8a8a8a">Ch. 2 &amp; 6</text>

  <!-- Step 2 -->
  <rect x="152" y="80" width="122" height="110" rx="6" fill="#f4eef2" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="213" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#6f42c1">2</text>
  <text x="213" y="130" text-anchor="middle" font-size="11" fill="#2a2a2a">Define a</text>
  <text x="213" y="145" text-anchor="middle" font-size="11" fill="#2a2a2a">Research Question</text>
  <text x="213" y="170" text-anchor="middle" font-size="10" fill="#8a8a8a">your own</text>

  <!-- Step 3 -->
  <rect x="289" y="80" width="122" height="110" rx="6" fill="#f4eef2" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="350" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#6f42c1">3</text>
  <text x="350" y="130" text-anchor="middle" font-size="11" fill="#2a2a2a">Load &amp;</text>
  <text x="350" y="145" text-anchor="middle" font-size="11" fill="#2a2a2a">Clean</text>
  <text x="350" y="170" text-anchor="middle" font-size="10" fill="#8a8a8a">Ch. 4 &amp; 5</text>

  <!-- Step 4 -->
  <rect x="426" y="80" width="122" height="110" rx="6" fill="#f4eef2" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="487" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#6f42c1">4</text>
  <text x="487" y="130" text-anchor="middle" font-size="11" fill="#2a2a2a">Analyze &amp;</text>
  <text x="487" y="145" text-anchor="middle" font-size="11" fill="#2a2a2a">Visualize</text>
  <text x="487" y="170" text-anchor="middle" font-size="10" fill="#8a8a8a">Ch. 3 &amp; 7</text>

  <!-- Step 5 (optional) -->
  <rect x="563" y="80" width="122" height="110" rx="6" fill="#f8f6fb" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="624" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#6f42c1">5</text>
  <text x="624" y="128" text-anchor="middle" font-size="11" fill="#2a2a2a">Prediction Model</text>
  <text x="624" y="143" text-anchor="middle" font-size="10" fill="#8a8a8a">(optional)</text>
  <text x="624" y="170" text-anchor="middle" font-size="10" fill="#8a8a8a">Ch. 8</text>

  <g stroke="#a8a8a8" stroke-width="2" fill="none">
    <path d="M 137 135 L 150 135"/>
    <path d="M 274 135 L 287 135"/>
    <path d="M 411 135 L 424 135"/>
    <path d="M 548 135 L 561 135"/>
  </g>
  <g fill="#a8a8a8">
    <polygon points="150,135 143,131 143,139"/>
    <polygon points="287,135 280,131 280,139"/>
    <polygon points="424,135 417,131 417,139"/>
    <polygon points="561,135 554,131 554,139"/>
  </g>
</svg>
