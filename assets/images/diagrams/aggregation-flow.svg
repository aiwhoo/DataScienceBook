  <text x="625" y="71" text-anchor="middle" font-size="10" font-weight="600" fill="#10a37f">Summary Row</text>

  <g stroke="#a8a8a8" stroke-width="1.5" fill="none">
    <path d="M 140 60 L 173 60"/>
    <path d="M 355 60 L 388 60"/>
    <path d="M 520 60 L 553 60"/>
  </g>
  <g fill="#a8a8a8">
