<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="120" fill="#fafafa"/>
  <rect x="10" y="35" width="110" height="50" rx="5" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.25"/>
  <text x="65" y="65" text-anchor="middle" font-size="10" fill="#2a2a2a">Open Terminal</text>

  <rect x="150" y="35" width="150" height="50" rx="5" fill="#ffffff" stroke="#2a2a2a" stroke-width="1.25"/>
